[project]
name = "karoo-finance-data-platform"
version = "1.0.0"
description = "End-to-end batch ELT pipeline: APIs and files -> Python -> PostgreSQL -> dbt -> Airflow"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL warehouse (skipped if none is reachable)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["warehouse", "learning"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B008"]   # B008: FastAPI's Depends()/Query() defaults are the intended pattern
